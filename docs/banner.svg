<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">BrandProof: every claim gets proof, every verdict gets a receipt</title>
  <desc id="d">A Proof Pack receipt listing claims checked against approved facts, what was not checked, and a human approval stamp.</desc>
  <rect width="1280" height="340" fill="#0a1f3d"/>
  <rect y="334" width="1280" height="6" fill="#14b8a6"/>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <rect x="64" y="40" width="30" height="30" rx="8" fill="#0f766e"/>
    <path d="M71 55.5l5.5 5.5 10-11" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="106" y="63" font-size="22" font-weight="700" fill="#ffffff">BrandProof</text>

    <text x="64" y="150" font-size="47" font-weight="800" fill="#ffffff" letter-spacing="-0.8">Every claim gets proof.</text>
    <text x="64" y="204" font-size="47" font-weight="800" fill="#ffffff" letter-spacing="-0.8">Every verdict gets a receipt.</text>

    <text x="64" y="244" font-size="18" fill="#b9c8dd">Checks content against your approved rules and facts before it goes live.</text>
    <text x="64" y="270" font-size="18" fill="#b9c8dd">A person always makes the final call.</text>

    <g font-size="15" font-weight="600" fill="#5eead4">
      <text x="64" y="311">Claim Ledger + Intent Lock</text>
      <rect x="290" y="297" width="1.5" height="18" fill="#2c4a6e"/>
      <text x="312" y="311">Trust Layer + Proof Pack</text>
      <rect x="506" y="297" width="1.5" height="18" fill="#2c4a6e"/>
      <text x="528" y="311">Rulebook Red-Team</text>
    </g>
  </g>

  <g transform="translate(884 28) rotate(2.2 165 130)">
    <polygon points="0,0 330,0 330,272 319,272 308,265 297,272 286,265 275,272 264,265 253,272 242,265 231,272 220,265 209,272 198,265 187,272 176,265 165,272 154,265 143,272 132,265 121,272 110,265 99,272 88,265 77,272 66,265 55,272 44,265 33,272 22,265 11,272 0,265" transform="translate(6 8)" fill="#000000" opacity="0.28"/>
    <polygon points="0,0 330,0 330,272 319,272 308,265 297,272 286,265 275,272 264,265 253,272 242,265 231,272 220,265 209,272 198,265 187,272 176,265 165,272 154,265 143,272 132,265 121,272 110,265 99,272 88,265 77,272 66,265 55,272 44,265 33,272 22,265 11,272 0,265" fill="#f4f7fa"/>
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
      <text x="22" y="36" font-size="17" font-weight="800" fill="#0a1f3d">Proof Pack</text>
      <text x="22" y="54" font-size="12" fill="#5b6b80">Savings launch post</text>
    </g>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12">
      <g fill="#1b2b44">

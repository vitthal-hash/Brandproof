# Render Blueprint (free plan). New > Blueprint > pick this repo.
# Database = Supabase Postgres (you paste its URL as DATABASE_URL). Uploaded files are stored in that database,
# so no Render disk is needed. See DEPLOY.md for where each value comes from.
services:
  - type: web
    name: brandproof-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false            # paste your Supabase connection string (postgresql+psycopg://...)
      - key: GEMINI_API_KEY
        sync: false            # paste your Google AI Studio key
      - key: BP_GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: BP_LLM_PROVIDER
        value: auto
      - key: BP_STORAGE
        value: db
      - key: BP_SECRET
        generateValue: true
      - key: BP_SEED
        value: "1"
      - key: BP_CORS_ORIGINS
        value: https://brandproof-web.onrender.com   # change if your web service URL is different
  - type: web
    name: brandproof-web
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: BACKEND_URL
        value: https://brandproof-api.onrender.com   # change if your API service URL is different
